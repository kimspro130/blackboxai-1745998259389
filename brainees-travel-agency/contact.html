<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Brainees Travel Agency</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-['Roboto'] text-gray-800">
  <header class="bg-white shadow-md fixed w-full z-10">
    <nav class="container mx-auto flex items-center justify-between p-4">
      <a href="index.html" class="text-2xl font-bold text-blue-600">Brainees Travel</a>
      <ul class="hidden md:flex space-x-6 text-lg">
        <li><a href="index.html" class="hover:text-blue-500 transition">Home</a></li>
        <li><a href="about.html" class="hover:text-blue-500 transition">About Us</a></li>
        <li><a href="services.html" class="hover:text-blue-500 transition">Services</a></li>
        <li><a href="gallery.html" class="hover:text-blue-500 transition">Gallery</a></li>
        <li><a href="contact.html" class="hover:text-blue-500 transition font-semibold text-blue-600">Contact Us</a></li>
      </ul>
      <div class="md:hidden">
        <button id="menu-btn" class="text-gray-700 focus:outline-none">
          <i class="fas fa-bars fa-lg"></i>
        </button>
      </div>
    </nav>
    <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md">
      <ul class="flex flex-col p-4 space-y-2 text-lg">
        <li><a href="index.html" class="block hover:text-blue-500 transition">Home</a></li>
        <li><a href="about.html" class="block hover:text-blue-500 transition">About Us</a></li>
        <li><a href="services.html" class="block hover:text-blue-500 transition">Services</a></li>
        <li><a href="gallery.html" class="block hover:text-blue-500 transition">Gallery</a></li>
        <li><a href="contact.html" class="block hover:text-blue-500 transition font-semibold text-blue-600">Contact Us</a></li>
      </ul>
    </div>
  </header>

  <main class="pt-20 container mx-auto px-4 py-16 max-w-lg">
    <h1 class="text-4xl font-bold mb-6 text-center">Contact Us</h1>
    <form action="#" method="POST" class="bg-white rounded-lg shadow p-8 space-y-6">
      <div>
        <label for="name" class="block text-gray-700 font-semibold mb-2">Name</label>
        <input type="text" id="name" name="name" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
        <input type="email" id="email" name="email" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="subject" class="block text-gray-700 font-semibold mb-2">Subject</label>
        <input type="text" id="subject" name="subject" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="message" class="block text-gray-700 font-semibold mb-2">Message</label>
        <textarea id="message" name="message" rows="5" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded hover:bg-blue-700 transition">Send Message</button>
    </form>
  </main>

  <footer class="bg-white shadow-inner py-6 mt-12">
    <div class="container mx-auto text-center text-gray-600">
      &copy; 2024 Brainees Travel Agency. All rights reserved.
    </div>
  </footer>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>
</body>
</html>
